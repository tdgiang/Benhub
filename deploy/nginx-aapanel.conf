# ============================================================
# Nginx config cho aaPanel / BaoTA
# Dán vào: aaPanel → Websites → [benhub.vn] → Config → nginx
# Hoặc: /www/server/panel/vhost/nginx/benhub.vn.conf
#
# Yêu cầu: SSL đã được cấp qua aaPanel Let's Encrypt
# ============================================================

# ── HTTP → HTTPS redirect ────────────────────────────────────
server {
    listen 80;
    server_name benhub.vn www.benhub.vn;
    return 301 https://$host$request_uri;
}

# ── HTTPS main ───────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name benhub.vn www.benhub.vn;

    # SSL — aaPanel tự quản lý đường dẫn này
    ssl_certificate     /www/server/panel/vhost/cert/benhub.vn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/benhub.vn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"    always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Giới hạn upload 15 MB
    client_max_body_size 15M;

    # ── Backend NestJS API ────────────────────────────────────
    location /api-backend/ {
        proxy_pass         http://127.0.0.1:4000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Uploads tĩnh (cache 7 ngày) ──────────────────────────
    location /uploads/ {
        proxy_pass         http://127.0.0.1:3000/uploads/;
        add_header         Cache-Control "public, max-age=604800, immutable";
    }

    # ── Next.js frontend ─────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
