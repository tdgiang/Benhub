services:
  # ─── Infrastructure ────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: benhub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-benhub}
      POSTGRES_USER: ${POSTGRES_USER:-benhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-benhub} -d ${POSTGRES_DB:-benhub}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: benhub_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal

  # ─── Backend (NestJS) ──────────────────────────────────────────────────────
  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: benhub_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-benhub}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-benhub}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CORS_ORIGIN: ${APP_URL}
      THROTTLE_TTL: 60000
      THROTTLE_LIMIT: 100
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    labels:
      - "traefik.enable=false"

  # ─── DB Migration (runs once) ──────────────────────────────────────────────
  migrate:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: benhub_migrate
    entrypoint: []
    command: >
      sh -c "./node_modules/.bin/prisma migrate deploy --config prisma.config.mjs &&
             ./node_modules/.bin/prisma db execute --file prisma/add-cover-image.sql --config prisma.config.mjs || true &&
             node prisma/seed.mjs"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-benhub}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-benhub}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    restart: "no"

  # ─── Frontend (Next.js) ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${APP_URL}/api-backend
        NEXT_PUBLIC_APP_NAME: BenHub
        NEXT_PUBLIC_APP_URL: ${APP_URL}
    container_name: benhub_frontend
    restart: unless-stopped
    environment:
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${APP_URL}
      INTERNAL_API_URL: http://backend:4000
      NEXT_PUBLIC_API_URL: ${APP_URL}/api-backend
      NEXT_PUBLIC_APP_URL: ${APP_URL}
    volumes:
      - uploads_data:/app/public/uploads
    depends_on:
      - backend
    networks:
      - internal
      - web

  # ─── Nginx reverse proxy ───────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: benhub_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - uploads_data:/var/www/uploads:ro
    depends_on:
      - frontend
      - backend
    networks:
      - web
      - internal

volumes:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  internal:
    driver: bridge
  web:
    driver: bridge
