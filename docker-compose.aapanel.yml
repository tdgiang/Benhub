# ============================================================
# docker-compose.aapanel.yml — Override cho VPS có aaPanel
# ============================================================
# Dùng khi VPS đã có nginx hệ thống (aaPanel/BaoTA/Webmin...)
# chiếm port 80/443. Bỏ Docker nginx, để system nginx proxy.
#
# Cách chạy:
#   docker compose -f docker-compose.production.yml -f docker-compose.aapanel.yml up -d
#
# ============================================================

services:
  # Tắt Docker nginx — system nginx của aaPanel đảm nhận
  nginx:
    profiles:
      - standalone   # chỉ khởi động khi truyền --profile standalone

  # Expose frontend ra public (Method B — truy cập trực tiếp qua IP:3000)
  frontend:
    ports:
      - "3000:3000"

  # Expose backend ra public (Method B — truy cập trực tiếp qua IP:4000)
  backend:
    ports:
      - "4000:4000"
